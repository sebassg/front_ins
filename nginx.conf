# Sirve la SPA. Cualquier ruta que no sea un archivo cae en index.html:
# el enrutamiento lo hace React Router en el navegador.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El proxy de delante (Traefik) ya resuelve TLS; este encabezado evita
    # que el navegador vuelva a pedir la página por http.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los archivos de dist/assets llevan hash en el nombre: se pueden cachear
    # para siempre. index.html nunca, o el usuario quedaría con una versión vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
